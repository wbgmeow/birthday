<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#90CDF3">
<title>Приглашение</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#90CDF3;--navy:#1F5C88;--yel:#FFDD4A;--or:#F0891B;
  --wish-color:#1F5C88;   /* цвет текста и иконки в блоке «Вишлист» */
  --card-offset:26px;     /* на сколько опустить белый блок вниз (px) */
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--blue);font-family:Jost,system-ui,sans-serif;color:#17324a}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
/* ---------- страница 1 ---------- */
#p1{position:fixed;inset:0;z-index:10;overflow:hidden;background:var(--blue);transition:transform .9s cubic-bezier(.7,0,.3,1)}
#p1.out{transform:translateY(-105%)}
#stage{position:fixed;left:50%;top:50%;width:max(100vw,calc(100dvh*.46127));aspect-ratio:786/1704;transform:translate(-50%,-50%);background:url(face.png) center/100% 100% no-repeat}
.eye{position:absolute;top:49.18%;width:36.13%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
.eye.l{left:27.99%}.eye.r{left:72.26%}
.pupil{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 60% 60%,#7b4510,#5a2f08);transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px)))}
.pupil::before{content:"";position:absolute;left:10%;top:10%;width:66%;aspect-ratio:1;border-radius:50%;background:#000}
.pupil::after{content:"";position:absolute;left:24%;top:22%;width:17%;aspect-ratio:1;border-radius:50%;background:#fff}
.lid{position:absolute;inset:0;background:#FFDD4A;transform:translateY(-101%)}
.blink .lid{animation:blink .22s}
@keyframes blink{45%,55%{transform:translateY(0)}}
#open{position:fixed;left:50%;top:6.1dvh;height:8dvh;min-height:60px;width:min(74vw,320px);transform:translateX(-50%);border:0;border-radius:999px;background:var(--yel);color:var(--navy);font:700 clamp(28px,8.5vw,36px) Jost,sans-serif;letter-spacing:0;box-shadow:none;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
#open:active{transform:translateX(-50%) scale(.95)}
@keyframes pulse{50%{scale:1.04}}
/* ---------- страница 2 ---------- */
#p2{position:fixed;inset:0;z-index:5;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.title{margin-top:auto;text-align:center;line-height:1;margin-bottom:2px}
.t1{font:600 clamp(32px,10vw,44px)/1.05 Jost,sans-serif;color:var(--navy)}
.t2{font:700 clamp(50px,16vw,70px)/1 Oswald,Impact,sans-serif;color:var(--or);letter-spacing:1px;margin-top:2px;transform:rotate(-3deg) skewX(-4deg);text-shadow:-4px 4px 0 #FFE9A6;display:inline-block}
.sub{margin-top:6px;font-weight:600;color:var(--navy);font-size:17px}
.card{margin-top:var(--card-offset);width:100%;max-width:400px;background:#F5F5F5;border-radius:22px;padding:16px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(31,92,136,.18)}
svg.i{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--navy)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal b{font-size:12px;color:#8a97a3;font-weight:600}
.cal i{font-style:normal;background:#fff;border-radius:9px;aspect-ratio:1;display:grid;place-items:center;font-weight:600;font-size:15px;position:relative}
.cal .f{color:#c3c9ce}
.cal .hit{background:var(--navy);color:#fff;font-weight:700}
.ring{position:absolute;left:-9px;top:-9px;width:calc(100% + 18px);height:calc(100% + 18px);overflow:visible;pointer-events:none}
.ring path{fill:none;stroke:var(--or);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .ring path{animation:draw .9s ease 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:11px 14px;color:var(--navy);text-decoration:none}
.row .tx{flex:1;color:#17324a;font-weight:600;font-size:17px}
.row .big{font-weight:600;font-size:17px;color:#17324a}
.row small{font-size:14px;color:#6b7b88;font-weight:500;text-align:right}
.left{text-align:center;font-size:14px;color:#6b7b88;font-weight:500;margin-top:-4px}
.wish{margin-bottom:auto;width:100%;max-width:400px;display:flex;align-items:center;gap:14px;background:var(--yel);color:var(--wish-color);border-radius:20px;padding:14px 16px;text-decoration:none;box-shadow:0 6px 0 #d4b11c}
.wish:active{transform:translateY(4px);box-shadow:0 2px 0 #d4b11c}

.wish b{display:block;font-size:20px;line-height:1.1}.wish div span{display:block;margin-top:1px;font-size:14px;line-height:1.15;font-weight:500;opacity:.85}
.wish div{flex:1}
@keyframes wig{0%,70%,100%{rotate:0deg}78%{rotate:-12deg}86%{rotate:10deg}94%{rotate:-6deg}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.3,.4,1);transition-delay:calc(var(--i)*.14s + .55s)}
.go .rv{opacity:1;transform:none}

<body>
<canvas id="cv"></canvas>

<div id="p1">
  <div id="stage">
    <div class="eye l"><div class="pupil"></div><div class="lid"></div></div>
    <div class="eye r"><div class="pupil"></div><div class="lid"></div></div>
  </div>
  <button id="open">ОТКРЫТЬ</button>
</div>

<div id="p2">
  <div class="title rv" style="--i:0"><div class="t1">приглашение<br>на</div><div class="t2">BIRTHDAY</div></div>
  <div class="card rv" style="--i:1">
    <div class="ch"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="mon"></span></div>
    <div class="cal" id="cal"></div>
    <div class="row"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="big" id="time"></span></div>
    <a class="row" id="map" target="_blank"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="tx" id="place"></span><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="left" id="left"></div>
  </div>
  <a class="wish rv" style="--i:2" id="wish" target="_blank"><span class="gift"></span><div><b>Вишлист</b><span>Идеи подарков для именинницы</span></div><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M9 6l6 6-6 6"/></svg></a>
</div>

<script>
/* ====== НАСТРОЙКИ ====== */
const C={
  name:"Лия",
  start:"2026-12-07T19:00",
  place:"Ул. Цюрупы 42",
  mapUrl:"https://yandex.ru/maps/?text="+encodeURIComponent("Уфа, улица Цюрупы 42"),
  wishlistUrl:"https://followish.io/mywishlist/1setlaefsovow2"
};
/* ======================= */
const $=id=>document.getElementById(id);
const s=new Date(C.start),Y=s.getFullYear(),M=s.getMonth(),D=s.getDate();
const mon=new Intl.DateTimeFormat("ru",{month:"long"}).format(s);
$("mon").textContent=mon[0].toUpperCase()+mon.slice(1)+" "+Y;
$("time").textContent=s.toTimeString().slice(0,5);
$("place").textContent=C.place;$("map").href=C.mapUrl;$("wish").href=C.wishlistUrl;
const RING='<svg class="ring" viewBox="0 0 60 60"><path pathLength="1" d="M9 35C4 17 27 5 44 10c14 5 13 33-6 42C20 59 4 47 8 27c2-8 10-14 19-16"/></svg>';
const first=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate(),pd=new Date(Y,M,0).getDate();
let h="";["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(w=>h+=`<b>${w}</b>`);
for(let i=0;i<Math.ceil((first+dim)/7)*7;i++){const n=i-first+1;let c="",t=n;
  if(n<1){t=pd+n;c="f"}else if(n>dim){t=n-dim;c="f"}else if(n===D)c="hit";
  h+=`<i class="${c}">${t}${c==="hit"?RING:""}</i>`}
$("cal").innerHTML=h;
const ms=s-Date.now(),days=Math.floor(ms/864e5),pl=(n,a)=>a[n%10==1&&n%100!=11?0:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2];
$("left").textContent=ms<=0?"Праздник уже начался!":days>=1?`До праздника ${days} ${pl(days,["день","дня","дней"])}`:"Праздник уже сегодня!";

/* ---- глаза ---- */
const eyes=[...document.querySelectorAll(".eye")].map(el=>({el,p:el.querySelector(".pupil"),x:0,y:0}));
let tgt=null,last=0,run=true;
const look=(x,y)=>{tgt={x,y};last=Date.now()};
addEventListener("pointermove",e=>look(e.clientX,e.clientY));
addEventListener("pointerdown",e=>look(e.clientX,e.clientY));
addEventListener("touchmove",e=>look(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
(function idle(){if(!run)return;if(Date.now()-last>2500)tgt={x:Math.random()*innerWidth,y:Math.random()*innerHeight*.85};setTimeout(idle,1100+Math.random()*1500)})();
(function bl(){if(!run)return;eyes.forEach(e=>{e.el.classList.remove("blink");void e.el.offsetWidth;e.el.classList.add("blink")});setTimeout(bl,2500+Math.random()*3000)})();
(function frame(){
  for(const e of eyes){const r=e.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.22;
    let tx=0,ty=0;if(tgt){const dx=tgt.x-cx,dy=tgt.y-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/(r.width*1.2));tx=dx/d*max*k;ty=dy/d*max*k}
    e.x+=(tx-e.x)*.16;e.y+=(ty-e.y)*.16;e.p.style.setProperty("--x",e.x+"px");e.p.style.setProperty("--y",e.y+"px")}
  if(run)requestAnimationFrame(frame)})();

/* ---- конфетти ---- */
const cv=$("cv"),x=cv.getContext("2d");let P=[],on=false;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}fit();addEventListener("resize",fit);
function burst(n,ox,oy){const cols=["#FFDD4A","#1F5C88","#F0891B","#fff"];
  for(let i=0;i<n;i++)P.push({x:ox,y:oy,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6,s:Math.random()*14+8,b:Math.random()<.3,c:cols[i%4]});
  if(!on){on=true;loop()}}
function loop(){const d=devicePixelRatio;x.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.y<innerHeight+30);
  for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x*d,p.y*d);x.rotate(p.r);
    if(p.b){const k=p.s*d*.9;x.scale(k,k);x.beginPath();x.moveTo(-1,0);x.quadraticCurveTo(0,1.5,1,-.6);x.quadraticCurveTo(.1,.75,-1,0);x.fillStyle="#FFE135";x.fill();x.lineWidth=.12;x.strokeStyle="#7a4e0e";x.stroke()}
    else{x.fillStyle=p.c;x.fillRect(0,0,p.s*.6*d,p.s*d)}x.restore()}
  if(P.length)requestAnimationFrame(loop);else on=false}

/* ---- открыть ---- */
$("open").onclick=()=>{
  const r=$("open").getBoundingClientRect();look(r.left+r.width/2,r.top);
  burst(80,r.left+r.width/2,r.top+r.height/2);if(navigator.vibrate)navigator.vibrate(40);
  setTimeout(()=>{$("p1").classList.add("out");$("p2").classList.add("go");burst(60,innerWidth/2,innerHeight*.35)},350);
  setTimeout(()=>run=false,1400)};
</script>
</body>
</html>
